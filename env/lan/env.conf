# lan: the Mac (A: ultrabench) and screwdriver (B: memsrv.service) cabled
# directly to each other (CLAUDE.md §5). No DHCP on a direct link: both
# addresses are set by hand, in their own subnet so they can't collide with
# Wi-Fi, local (10.99.0.x) or tb (10.98.0.x).
# KEY=VALUE only: sourced by scripts, parsed by -env lan.
ADDR_A=10.97.0.1
ADDR_B=10.97.0.2
PREFIX=24
MTU=1500
PORT=5555
MEMSRV_MB=8192
