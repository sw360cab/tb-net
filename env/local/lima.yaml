# Lima VM for tb-net on macOS: stock Ubuntu LTS kernel (userfaultfd, >= 6.6),
# nested KVM for Firecracker, and its own rootful Docker daemon that the
# make docker-* targets use. Created by `make vm-up`, which mounts the repo
# writable at the same path so docker bind mounts resolve inside the VM.
minimumLimaVersion: 2.0.0
base:
- template:docker-rootful
vmType: vz
nestedVirtualization: true
cpus: 4
memory: 12GiB
disk: 40GiB
# make, so the docker-* targets also work from `limactl shell tbnet`. Go stays
# in the image only: use `make dev CMD="make test"` for Go commands in the VM.
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    command -v make >/dev/null 2>&1 && exit 0
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends make
