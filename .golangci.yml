version: "2"

run:
  timeout: 3m
  tests: true

linters:
  # defaults: errcheck govet ineffassign staticcheck unused
  enable:
    - misspell
    - revive
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
